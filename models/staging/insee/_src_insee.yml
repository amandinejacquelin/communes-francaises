sources:
  - name: insee
    database: raw
    schema: insee
    description: Open source data from INSEE
    tables:
      - name: communes_2022
        description: Open source data from French municipalities in 2022
        columns:
          - name: num
            data_type: number
            description: Primary key of the dataset
            data_tests:
              - unique
              - not_null
              
          - name: code_insee
            data_type: varchar
            description : Unique identifier of a municipality
            data_tests:
              - unique
              - not_null

          - name: nom_standard
            data_type: varchar
          - name: reg_code
            data_type: varchar
          - name: reg_nom
            data_type: varchar
          - name: dep_code
            data_type: varchar
          - name: dep_nom
            data_type: varchar
          - name: population
            data_type: number

